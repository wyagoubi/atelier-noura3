<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>إتمام الطلب | Atelier Noura</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="site-header"><a class="logo" href="index.html">Atelier <span>Noura</span></a><a href="cart.html">← العودة للسلة</a></header>
<main class="section checkout">
<div><p class="eyebrow">CHECKOUT</p><h1>إتمام الطلب</h1>
<form id="checkoutForm" class="form-card">
<label>الاسم الكامل<input name="name" required></label>
<label>رقم الهاتف<input name="phone" type="tel" required placeholder="05 / 06 / 07"></label>
<label>الولاية<select name="wilaya" id="wilaya" required><option value="">اختاري الولاية</option></select></label>
<label>طريقة التوصيل<select name="delivery" required><option value="home">التوصيل إلى المنزل</option><option value="office">مكتب شركة التوصيل</option></select></label>
<label>البلدية / العنوان<textarea name="address" required></textarea></label>
<label>ملاحظات اختيارية<textarea name="notes"></textarea></label>
<button class="btn" type="submit">تأكيد الطلب</button>
</form></div>
<aside id="checkoutSummary" class="summary"></aside>
</main>
<footer class="footer"><strong>Atelier Noura</strong></footer>
<script src="js/products.js"></script><script src="js/cart.js"></script><script src="js/app.js"></script>
</body></html>
